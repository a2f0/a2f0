<?xml version="1.0" encoding="UTF-8"?>
<!-- The a2f0 mark: nine days of a contributions grid in Primer's dark-theme greens on its dark
     canvas, #0d1117, which src/theme.ts (DARK.canvas) and agent-tool.json's image fills repeat. Cells are 8 units with 2-unit gaps and margins, so every edge lands on a whole pixel
     at 16 and 32 pixels. agent-tool renders the favicons and the preview image from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>a2f0</title>
  <rect width="32" height="32" rx="6" fill="#0d1117"/>
  <rect x="2" y="2" width="8" height="8" rx="1.5" fill="#033a16"/>
  <rect x="12" y="2" width="8" height="8" rx="1.5" fill="#2ea043"/>
  <rect x="22" y="2" width="8" height="8" rx="1.5" fill="#56d364"/>
  <rect x="2" y="12" width="8" height="8" rx="1.5" fill="#196c2e"/>
  <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#56d364"/>
  <rect x="22" y="12" width="8" height="8" rx="1.5" fill="#196c2e"/>
  <rect x="2" y="22" width="8" height="8" rx="1.5" fill="#56d364"/>
  <rect x="12" y="22" width="8" height="8" rx="1.5" fill="#033a16"/>
  <rect x="22" y="22" width="8" height="8" rx="1.5" fill="#2ea043"/>
</svg>
